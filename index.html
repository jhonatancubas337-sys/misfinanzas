<style>html,body{margin:0;height:100%;background:#F6F3EC;overflow:hidden;font-family:system-ui,sans-serif}

<body><iframe id="app" allow="clipboard-write; microphone"></iframe>
<div id="ent"><div><div style="font-size:40px">💰</div><h2 style="margin:8px 0;color:#0F5C4D">Mis Finanzas</h2>
<p style="color:#555">Para empezar, entra con tu cuenta de Google y da los permisos (solo la primera vez). Luego vuelve a abrir este link.</p>
<a id="go" target="_top">Entrar con Google</a></div></div>
<script>
var E='https://script.google.com/macros/s/AKfycbzUEfIw8xesuI3ifjNuhUdAyWu5-QflDnxzdXKZJJO-LqHLXiYI_EtX5r4p9yo-Y5SQ1w/exec',q=location.search||'';document.getElementById('app').src=E+q;document.getElementById('go').href=E+q;

try{var c=document.createElement('canvas');c.width=c.height=180;var g=c.getContext('2d');g.fillStyle='#0F5C4D';g.fillRect(0,0,180,180);g.fillStyle='#fff';g.font='bold 78px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('S/',90,96);document.getElementById('ati').href=c.toDataURL('image/png')}catch(e){}
